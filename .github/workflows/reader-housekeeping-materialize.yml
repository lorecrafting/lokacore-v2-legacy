# Temporary branch-only transport; excluded from the final PR commit ancestry.
name: Materialize reviewed reader housekeeping
on:
  push:
    branches: [docs/v3-reader-materialize]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'lorecrafting/lokacore' && github.ref == 'refs/heads/docs/v3-reader-materialize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply verified documentation edits and generate reader menus
        run: |
          git merge-base --is-ancestor 3e0aff993c0d4c76937544708f662a4624a08bfb HEAD
          python3 - <<'PY'
          import bz2
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          allowed = root / 'docs/rewrite-v3'
          folder = root / '.github/reader-housekeeping-payload'
          compressed = b''.join((folder / f'{i}.part').read_bytes() for i in range(3))
          if len(compressed) != 19720:
              raise SystemExit('Unexpected transport length')
          decoder = bz2.BZ2Decompressor()
          raw = decoder.decompress(compressed, max_length=200001)
          if len(raw) > 200000 or not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid or oversized transport')
          if hashlib.sha256(raw).hexdigest() != 'b0a1b6d6912e24d369dd9d953b3ad9e0feeca8217169a47b8969bc9dd50b1c6c':
              raise SystemExit('Transport digest mismatch')
          data = json.loads(raw)
          if data['base'] != '3e0aff993c0d4c76937544708f662a4624a08bfb' or len(data['entries']) != 16 or len(data['expected']) != 34:
              raise SystemExit('Wrong base or entry count')
          def checked_path(name):
              path = root / name
              if not name.startswith('docs/rewrite-v3/') or not path.resolve().is_relative_to(allowed) or path.is_symlink():
                  raise SystemExit('Unauthorized path')
              return path
          seen = set()
          prepared = []
          for entry in data['entries']:
              name = entry['path']
              path = checked_path(name)
              if name in seen:
                  raise SystemExit('Duplicate path')
              seen.add(name)
              if entry['old'] is None:
                  if path.exists():
                      raise SystemExit(f'New file already exists: {name}')
                  previous = b''
              else:
                  previous = path.read_bytes()
                  if hashlib.sha256(previous).hexdigest() != entry['old']:
                      raise SystemExit(f'Original changed: {name}')
              lines = previous.decode('utf-8').splitlines(keepends=True)
              prior_end = -1
              for start, end, text in entry['ops']:
                  if type(start) is not int or type(end) is not int or not isinstance(text, str):
                      raise SystemExit('Invalid edit type')
                  if not 0 <= start <= end <= len(lines) or start < prior_end:
                      raise SystemExit('Invalid or overlapping edit')
                  prior_end = end
              for start, end, text in reversed(entry['ops']):
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              if hashlib.sha256(result).hexdigest() != entry['new']:
                  raise SystemExit(f'Authored result mismatch: {name}')
              prepared.append((path, result))
          for name in data['expected']:
              checked_path(name)
          for path, result in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['python3', 'docs/rewrite-v3/checks/packet_navigation.py', '--write'], check=True)
          for name, digest in data['expected'].items():
              if hashlib.sha256(checked_path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Final result mismatch: {name}')
          print('All 34 final file hashes match the reviewed local candidate')
          PY
          git rm -r .github/reader-housekeeping-payload
          git add docs/rewrite-v3
      - name: Validate specification and reader navigation
        run: |
          python3 -m unittest discover -s docs/rewrite-v3/checks -p 'test_*.py' -v
          python3 docs/rewrite-v3/checks/release_scope.py --check
          python3 docs/rewrite-v3/checks/packet_navigation.py --check
          git diff --cached --check
      - name: Commit and push only the temporary review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(v3): reader guides and checked packet navigation'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/docs/v3-reader-materialize
