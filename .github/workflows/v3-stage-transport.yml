name: Temporary staged-readiness validation and publication
on:
  push:
    branches: [prep/v3-stage-transport-20260923]
permissions:
  contents: read
concurrency:
  group: v3-stage-transport-20260923
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify transport and reconstruct exact base amendment
        run: |
          mkdir -p "$RUNNER_TEMP/stage-evidence"
          python3 - <<'PYCODE'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          b = ''.join(Path('.v3-stage-transport/part%d.b64' % i).read_text() for i in (1,2,3))
          x = base64.b64decode(b, validate=True)
          assert hashlib.sha256(x).hexdigest() == '2093900f69ba7196419413eb9972bc816761d03b85e3b22725231235e78a7413'
          s = lzma.decompress(x)
          assert hashlib.sha256(s).hexdigest() == '07a55d7f85db426d257d38a074d9e7ca5cfde9f997caf1daacbb0ef17334e354'
          Path(os.environ['RUNNER_TEMP'], 'stage-evidence', 'input.json').write_bytes(s)
          print('Transport checksums verified')
          PYCODE
          git checkout --detach 037e6513f882b25512928aab5883f8545b58fc84
          export DATA_FILE="$RUNNER_TEMP/stage-evidence/input.json"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          allowed = set(['.github/workflows/v3-spec.yml', 'docs/rewrite-v3/14-implementation-plan.md', 'docs/rewrite-v3/15-acceptance-scenarios.md', 'docs/rewrite-v3/16-decision-register.md', 'docs/rewrite-v3/R-MILESTONES.md', 'docs/rewrite-v3/README.md', 'docs/rewrite-v3/REVIEW-GUIDE.md', 'docs/rewrite-v3/checks/readiness.py', 'docs/rewrite-v3/checks/test_readiness.py', 'docs/rewrite-v3/checks/test_staged_readiness.py', 'docs/rewrite-v3/conformance/README.md', 'docs/rewrite-v3/prep/after-pr-10/README.md', 'docs/rewrite-v3/prep/after-pr-10/fable-review-prompt.md', 'docs/rewrite-v3/prep/after-pr-10/oracle-review.pending.json', 'docs/rewrite-v3/prep/after-pr-10/owner-instruction-2026-09-23.md', 'docs/rewrite-v3/prep/after-pr-10/setup-review.pending.json', 'docs/rewrite-v3/prep/after-pr-10/setup.pending.json', 'docs/rewrite-v3/r1-acceptance-envelope.md', 'docs/rewrite-v3/r1-work-package.md', 'docs/rewrite-v3/reviews/2026-09-23-staged-preparation.md', 'docs/rewrite-v3/spec_tools/README.md', 'docs/rewrite-v3/spec_tools/lib/readiness.ex', 'docs/rewrite-v3/spec_tools/preserved-inputs.json', 'docs/rewrite-v3/spec_tools/test/spec_tools_test.exs'])
          items = json.loads(Path(os.environ['DATA_FILE']).read_text())
          assert len(items) == len(allowed) and {i['path'] for i in items} == allowed
          for item in items:
              p = Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              old = p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if p.exists() else None) == item['before'], str(p)
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert type(start) is int and type(end) is int and 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['after'], str(p)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(new)
          print('Applied and hash-verified', len(items), 'bounded files')
          PYCODE
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.4'
          elixir-version: '1.20.4'
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Format then validate isolated Elixir and Python
        run: |
          export EVIDENCE="$RUNNER_TEMP/stage-evidence"
          cd docs/rewrite-v3/spec_tools
          elixir --version | tee "$EVIDENCE/toolchain.log"
          cat "$INSTALL_DIR_FOR_OTP/releases/28/OTP_VERSION" | tee -a "$EVIDENCE/toolchain.log"
          mix format
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test | tee "$EVIDENCE/elixir-default.log"
          mix test --include comparison | tee "$EVIDENCE/elixir-comparison.log"
          mix loka.readiness --check-template
          for stage in A1 A2; do
            for input in ../conformance/r1-run-manifest.template.json ../prep/after-pr-10/setup.pending.json; do
              for checker in mix python; do
                set +e
                if [ "$checker" = mix ]; then
                  output=$(mix loka.readiness --require-ready "$input" --evidence-root .. --stage "$stage" 2>&1)
                else
                  output=$(python3 ../checks/readiness.py --require-ready "$input" --evidence-root .. --stage "$stage" 2>&1)
                fi
                result=$?
                set -e
                printf '%s %s %s exit=%s\n%s\n' "$checker" "$stage" "$input" "$result" "$output" | tee -a "$EVIDENCE/negative-probes.log"
                test "$result" -eq 1
                grep -q 'NOT READY: preparation pending' <<< "$output"
              done
            done
          done
          cd ../../..
          python3 -m unittest discover -s docs/rewrite-v3/checks -p 'test_*.py' -v 2>&1 | tee "$EVIDENCE/python.log"
          python3 docs/rewrite-v3/checks/release_scope.py --check
          python3 docs/rewrite-v3/checks/packet_navigation.py --check
          python3 docs/rewrite-v3/checks/readiness.py --check-template
          (cd docs/rewrite-v3/prep/after-pr-10/dependency-evidence && sha256sum --check SHA256SUMS)
          git diff --check
      - name: Retain formatted source and validated tree
        run: |
          export EVIDENCE="$RUNNER_TEMP/stage-evidence"
          python3 - <<'PYCODE'
          import difflib, hashlib, json, os, subprocess
          from pathlib import Path
          base = '037e6513f882b25512928aab5883f8545b58fc84'
          items = json.loads(Path(os.environ['EVIDENCE'], 'input.json').read_text())
          for item in items:
              p = item['path']
              r = subprocess.run(['git','show',base+':'+p], capture_output=True)
              old = r.stdout if r.returncode == 0 else b''
              assert (hashlib.sha256(old).hexdigest() if r.returncode == 0 else None) == item['before']
              new = Path(p).read_bytes()
              a,b = old.decode().splitlines(keepends=True), new.decode().splitlines(keepends=True)
              item['edits'] = [[i,j,''.join(b[k:l])] for op,i,j,k,l in difflib.SequenceMatcher(None,a,b,autojunk=False).get_opcodes() if op != 'equal']
              item['after'] = hashlib.sha256(new).hexdigest()
              subprocess.run(['git','add','--',p],check=True)
          s = json.dumps(items,ensure_ascii=False,separators=(',',':')).encode()
          Path(os.environ['EVIDENCE'],'validated.json').write_bytes(s)
          Path(os.environ['EVIDENCE'],'validated.sha256').write_text(hashlib.sha256(s).hexdigest()+'\n')
          paths = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(paths) == {i['path'] for i in items}, paths
          print('Validated exact file set:',len(paths))
          PYCODE
          git diff --cached --check
          git diff --exit-code
          git write-tree | tee "$EVIDENCE/tree.txt"
          git diff --cached --binary > "$EVIDENCE/reviewed.patch"
          git archive --format=tar.gz --output="$EVIDENCE/reviewed-source.tar.gz" "$(cat "$EVIDENCE/tree.txt")" docs .github/workflows AGENTS.md
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-readiness-source
          path: ${{ runner.temp }}/stage-evidence/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 037e6513f882b25512928aab5883f8545b58fc84
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staged-readiness-source
          path: ${{ runner.temp }}/validated-source
      - name: Publish only hash-verified source, not transport ancestry
        run: |
          export EVIDENCE="$RUNNER_TEMP/validated-source"
          export DATA_FILE="$EVIDENCE/validated.json"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 037e6513f882b25512928aab5883f8545b58fc84
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ['DATA_FILE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == Path(os.environ['EVIDENCE'],'validated.sha256').read_text().strip()
          import hashlib, json, os
          from pathlib import Path
          allowed = set(['.github/workflows/v3-spec.yml', 'docs/rewrite-v3/14-implementation-plan.md', 'docs/rewrite-v3/15-acceptance-scenarios.md', 'docs/rewrite-v3/16-decision-register.md', 'docs/rewrite-v3/R-MILESTONES.md', 'docs/rewrite-v3/README.md', 'docs/rewrite-v3/REVIEW-GUIDE.md', 'docs/rewrite-v3/checks/readiness.py', 'docs/rewrite-v3/checks/test_readiness.py', 'docs/rewrite-v3/checks/test_staged_readiness.py', 'docs/rewrite-v3/conformance/README.md', 'docs/rewrite-v3/prep/after-pr-10/README.md', 'docs/rewrite-v3/prep/after-pr-10/fable-review-prompt.md', 'docs/rewrite-v3/prep/after-pr-10/oracle-review.pending.json', 'docs/rewrite-v3/prep/after-pr-10/owner-instruction-2026-09-23.md', 'docs/rewrite-v3/prep/after-pr-10/setup-review.pending.json', 'docs/rewrite-v3/prep/after-pr-10/setup.pending.json', 'docs/rewrite-v3/r1-acceptance-envelope.md', 'docs/rewrite-v3/r1-work-package.md', 'docs/rewrite-v3/reviews/2026-09-23-staged-preparation.md', 'docs/rewrite-v3/spec_tools/README.md', 'docs/rewrite-v3/spec_tools/lib/readiness.ex', 'docs/rewrite-v3/spec_tools/preserved-inputs.json', 'docs/rewrite-v3/spec_tools/test/spec_tools_test.exs'])
          items = json.loads(Path(os.environ['DATA_FILE']).read_text())
          assert len(items) == len(allowed) and {i['path'] for i in items} == allowed
          for item in items:
              p = Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              old = p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if p.exists() else None) == item['before'], str(p)
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  assert type(start) is int and type(end) is int and 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == item['after'], str(p)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(new)
          print('Applied and hash-verified', len(items), 'bounded files')
          PYCODE
          git switch -c prep/v3-staged-readiness
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          for item in json.loads(Path(os.environ['DATA_FILE']).read_text()):
              subprocess.run(['git','add','--',item['path']],check=True)
          PYCODE
          test "$(git write-tree)" = "$(cat "$EVIDENCE/tree.txt")"
          git diff --cached --check
          git config user.name 'Loka preparation assistant'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v3-prep): separate reviewed A1 semantics from A2 native qualification'
          test "$(git rev-parse HEAD^)" = 037e6513f882b25512928aab5883f8545b58fc84
          git push origin HEAD:refs/heads/prep/v3-staged-readiness
          git status --short
          git rev-parse HEAD | tee "$EVIDENCE/published-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-readiness-publication
          path: ${{ runner.temp }}/validated-source/
          retention-days: 7
          if-no-files-found: error
